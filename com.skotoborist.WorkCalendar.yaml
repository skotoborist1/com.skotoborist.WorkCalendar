id: com.skotoborist.WorkCalendar
runtime: org.gnome.Platform
runtime-version: "46"
sdk: org.gnome.Sdk
command: com.skotoborist.WorkCalendar
finish-args:
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland
  - --filesystem=home
modules:
  - name: work-calendar
    buildsystem: simple
    build-commands:
      # 1. Изменено имя бинарника, чтобы оно совпадало с ID приложения
      - install -Dm755 main.py /app/bin/com.skotoborist.WorkCalendar
      # 2. Добавлена строка копирования XML-файла метаданных
      - install -Dm644 com.skotoborist.WorkCalendar.metainfo.xml /app/share/metainfo/com.skotoborist.WorkCalendar.metainfo.xml
      - install -Dm644 com.skotoborist.WorkCalendar.desktop /app/share/applications/com.skotoborist.WorkCalendar.desktop
      - install -Dm644 com.skotoborist.WorkCalendar.svg /app/share/icons/hicolor/scalable/apps/com.skotoborist.WorkCalendar.svg
    sources:
      - type: file
        path: main.py
      # 3. Добавлен сам XML-файл в список источников сборки
      - type: file
        path: com.skotoborist.WorkCalendar.metainfo.xml
      - type: file
        path: com.skotoborist.WorkCalendar.desktop
      - type: file
        path: com.skotoborist.WorkCalendar.svg

